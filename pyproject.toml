[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "franka-pi05-mujoco"
version = "0.1.0"
description = "MuJoCo Franka workspace with an OpenPI pi0.5-compatible rollout client"
requires-python = ">=3.9"
dependencies = [
  "mujoco>=2.3.7",
  "numpy>=1.24",
  "Pillow>=9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
franka-pi05 = "franka_pi05.rollout:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
franka_pi05 = ["assets/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
